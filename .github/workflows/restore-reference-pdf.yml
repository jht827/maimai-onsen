name: Restore original reference PDF

on:
  push:
    branches: [main]
    paths:
      - '参考资料/MaimaiDX-D.pdf.part*'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore and verify original PDF
        run: python3 .github/restore_reference.py
      - name: Save verified original PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '参考资料/MaimaiDX-D.pdf'
          git rm -- '参考资料/MaimaiDX-D.pdf.part01' '参考资料/MaimaiDX-D.pdf.part02'
          git commit -m 'Restore original MaimaiDX-D.pdf with SHA-256 verification'
          git push
